[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laparoskan"
version = "0.1.0"
description = "Educational CT planning and simulation desktop application"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pydicom>=2.4,<4",
  "SimpleITK>=2.4,<3",
  "vtk>=9.3,<10",
  "PySide6-Essentials>=6.7,<7",
]

[project.scripts]
laparoskan = "laparoskan.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
